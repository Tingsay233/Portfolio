<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Say Si Ting</title>
  <!-- tan circle background -->
  <circle cx="32" cy="32" r="32" fill="#D4A373"/>
  <!-- big serif 's' -->
  <text x="30" y="50" text-anchor="middle"
        font-family="'Fraunces', 'Georgia', serif"
        font-size="60" font-weight="900"
        fill="#1F5E68" letter-spacing="-1.5">s</text>
  <!-- small superscript 't' (the square-root touch) -->
  <text x="48" y="25" text-anchor="middle"
        font-family="'Fraunces', 'Georgia', serif"
        font-size="22" font-weight="800"
        fill="#1F5E68">t</text>
</svg>
